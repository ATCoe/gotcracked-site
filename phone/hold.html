  <h1>Hold and resume</h1>
  <ol>
    <li>During a call, press <strong>Hold</strong>.</li>
    <li>To return, select that call and press <strong>Resume</strong>.</li>
  </ol>
  <p>With two calls, use the arrows to select the call you want.</p>
  <p class="note">Before starting another call, place the current caller on hold. Hold audio depends on your phone service.</p>

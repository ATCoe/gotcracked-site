name: Public Site CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check app.js
          node --check analytics-loader.js
          node --check customer-chat.js
          node --check pc-build.js
          node --check store-hours.js
          node --check supabase.js

      - name: Public site architecture
        shell: python
        run: |
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          request_html = Path('request.html').read_text(encoding='utf-8')
          appointment_html = Path('appointment.html').read_text(encoding='utf-8')
          pc_html = Path('pc-build.html').read_text(encoding='utf-8')
          privacy_html = Path('privacy.html').read_text(encoding='utf-8')
          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          headers = Path('_headers').read_text(encoding='utf-8')
          supabase = Path('supabase.js').read_text(encoding='utf-8')
          app = Path('app.js').read_text(encoding='utf-8')
          analytics = Path('analytics-loader.js').read_text(encoding='utf-8')
          chat = Path('customer-chat.js').read_text(encoding='utf-8')
          chat_css = Path('customer-chat.css').read_text(encoding='utf-8')
          pc_js = Path('pc-build.js').read_text(encoding='utf-8')
          pc_css = Path('pc-build.css').read_text(encoding='utf-8')
          store_hours_js = Path('store-hours.js').read_text(encoding='utf-8')
          release = Path('site-release.css').read_text(encoding='utf-8')
          guide = Path('repair-guide.css').read_text(encoding='utf-8')

          for css in Path('.').glob('*.css'):
              text = css.read_text(encoding='utf-8')
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'Unbalanced CSS braces: {css}')

          pages = html + request_html + appointment_html + pc_html + privacy_html
          refs = re.findall(r'(?:src|href)=["\']([^"\']+)["\']', pages)
          missing = []
          for ref in refs:
              ref = ref.split('?',1)[0].split('#',1)[0]
              if not ref or ref.startswith(('http://','https://','mailto:','tel:','#')):
                  continue
              if not Path(ref).exists():
                  missing.append(ref)
          if missing:
              raise SystemExit('Missing local references: ' + ', '.join(sorted(set(missing))))

          for ref in sorted(set(refs)):
              asset = ref.split('?',1)[0].split('#',1)[0]
              if not asset.lower().endswith('.webp'):
                  continue
              data = Path(asset).read_bytes()
              if len(data) < 20 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise SystemExit(f'Invalid WebP header: {asset}')
              declared_size = int.from_bytes(data[4:8], 'little') + 8
              if declared_size != len(data):
                  raise SystemExit(f'Truncated WebP asset: {asset} ({len(data)} bytes, expected {declared_size})')

          css_refs = re.findall(r'<link[^>]+rel=["\']stylesheet["\'][^>]+href=["\']([^"\']+)', html, re.I)
          css_files = [ref.split('?',1)[0] for ref in css_refs]
          required = ['styles.css','hardening.css','repair-guide.css','site-release.css']
          positions = []
          for name in required:
              if name not in css_files:
                  raise SystemExit(f'Missing required first-paint stylesheet: {name}')
              positions.append(css_files.index(name))
          if positions != sorted(positions) or css_files[-1] != 'site-release.css':
              raise SystemExit('site-release.css must remain the final first-paint stylesheet.')

          if 'id="repair-guide"' not in html:
              raise SystemExit('Repair education must remain static in index.html.')
          if 'service-rail-hint' not in html:
              raise SystemExit('Mobile service rail needs a static swipe affordance.')
          if 'id="booking-form"' in html or 'href="#book"' in html:
              raise SystemExit('Repair intake must not be embedded in or scroll within the homepage.')
          if 'id="booking-form"' not in request_html:
              raise SystemExit('Dedicated request page is missing the Portal intake form.')
          if 'request.html?mode=mail_in' not in html:
              raise SystemExit('Mail-in calls to action must open the dedicated request page.')
          if 'request.css' not in request_html:
              raise SystemExit('Dedicated request page stylesheet is missing.')
          if 'id="appointment-form"' not in appointment_html or 'const appointmentForm' not in app:
              raise SystemExit('Dedicated appointment flow is not wired.')
          if 'customer-chat.js' not in html or 'customer-chat.js' not in request_html:
              raise SystemExit('Quick-question chat must be available across customer flows.')

          # Custom PC planner must remain separate from repair intake and preserve the compatibility gate.
          if 'id="pc-build-form"' not in pc_html or 'pc-build.js' not in pc_html or 'pc-build.css' not in pc_html:
              raise SystemExit('Dedicated custom PC planner is incomplete.')
          if "functions.invoke('custom-pc-build'" not in pc_js:
              raise SystemExit('Custom PC planner is not wired to its research endpoint.')
          if 'Newegg PC Builder' not in pc_html or 'Newegg PC Builder' not in pc_js:
              raise SystemExit('Customer custom-PC flow must disclose Newegg compatibility verification.')
          if 'request.html?service=Custom%20PC%20build' in html or 'request.html?service=Custom+PC+build' in html:
              raise SystemExit('Homepage Custom PC CTAs must route directly to the dedicated planner, never repair intake.')
          if html.count('href="pc-build.html"') < 2:
              raise SystemExit('Both homepage Custom PC CTAs must link directly to pc-build.html.')
          if "pagePath.endsWith('/request')" not in chat or "pagePath.endsWith('/request.html')" not in chat or "location.replace('pc-build.html')" not in chat:
              raise SystemExit('Legacy Custom PC repair URLs must redirect from both Cloudflare pretty and .html request paths.')
          if "location.assign('pc-build.html')" not in chat:
              raise SystemExit('Custom PC CTA click routing guard is missing.')
          ram_copy = pc_html.lower()
          if ('temporary ram market notice' not in ram_copy or 'through 2027' not in ram_copy or '2028' not in ram_copy or 'industry outlook' not in ram_copy):
              raise SystemExit('Temporary RAM-market notice must explain the 2027 constraint, 2028 capacity outlook, and forecast uncertainty.')
          if 'https://gotcracked.co/pc-build.html' not in sitemap:
              raise SystemExit('Custom PC planner must remain in the public sitemap.')

          # Screen-recording mobile fixes must remain first-paint CSS.
          for token in ['body .container.process-grid','body .container.mail-in-grid','body .container.faq-grid','body .issue-card>.console-platforms','body .gc-chat-launcher']:
              if token not in chat_css:
                  raise SystemExit(f'Recorded mobile-layout fix missing: {token}')
          if 'width:50px!important' not in chat_css or 'font-size:0!important' not in chat_css:
              raise SystemExit('Mobile chat launcher must remain compact enough not to cover content.')

          # Customer data collection must remain transparent and linked to privacy terms.
          if 'Privacy Notice' not in request_html or 'Privacy Notice' not in appointment_html or 'Privacy Notice' not in pc_html:
              raise SystemExit('Customer submission flows must link the Privacy Notice.')
          if 'https://gotcracked.co/privacy.html' not in sitemap:
              raise SystemExit('Privacy Notice must remain in the public sitemap.')
          for required_copy in ['Information we collect','How we use it','AI-assisted custom PC research','Repair tracking','Customer chat','Website analytics','Data retention']:
              if required_copy not in privacy_html:
                  raise SystemExit(f'Privacy Notice is missing required section: {required_copy}')
          if 'passwords or payment-card details' not in chat:
              raise SystemExit('Website chat must warn customers not to send sensitive credentials/payment data.')

          # Appointment availability must match the Portal's canonical store hours.
          if '4–7 PM' in request_html or '4–7 PM' in appointment_html:
              raise SystemExit('Customer forms must not offer appointments after the 6 PM closing time.')
          if 'Late afternoon (4–6 PM)' not in request_html or 'Late afternoon (4–6 PM)' not in appointment_html:
              raise SystemExit('Late-afternoon appointment window is missing.')
          if "dateInput.min = localDateISO(new Date())" not in app:
              raise SystemExit('Same-day appointment requests must remain selectable.')
          if 'store-hours.js' not in request_html or 'store-hours.js' not in appointment_html:
              raise SystemExit('Customer appointment forms must load live store-hours availability.')
          for token in ["functions.invoke('public-media'", 'setCustomValidity', 'WINDOWS', 'DEFAULT_HOURS']:
              if token not in store_hours_js:
                  raise SystemExit(f'Store-hours scheduling guard is incomplete: {token}')

          # GA4 must remain opt-in by configuration, DNT-aware, and ad-signal disabled.
          if "import('./analytics-loader.js" not in supabase:
              raise SystemExit('Primary customer flows must load the analytics runtime after Supabase bootstrap.')
          if 'analytics-loader.js' not in privacy_html:
              raise SystemExit('Privacy page must load the standalone analytics runtime consistently.')
          for token in ['google_analytics_measurement_id','doNotTrack','allow_google_signals: false','allow_ad_personalization_signals: false','googletagmanager.com/gtag/js']:
              if token not in analytics:
                  raise SystemExit(f'GA4 privacy guard is incomplete: {token}')
          for token in ['https://www.googletagmanager.com','https://www.google-analytics.com','https://region1.google-analytics.com']:
              if token not in headers:
                  raise SystemExit(f'GA4 CSP endpoint missing: {token}')

          forbidden_supabase = ['createElement(', 'site-final-polish', 'site-mobile-fix', 'repair-guide.css']
          for token in forbidden_supabase:
              if token in supabase:
                  raise SystemExit(f'Supabase client must not own presentation/runtime injection: {token}')
          if "createElement('link')" in app or 'createElement("link")' in app:
              raise SystemExit('Public app runtime must not inject first-paint stylesheets.')

          for retired in ['site-final-polish.js','site-mobile-fix.js','site-mobile-fix.css','mobile-video-fixes.css']:
              if Path(retired).exists():
                  raise SystemExit(f'Retired runtime presentation file returned: {retired}')

          compact = re.sub(r'\s+', '', release)
          if '@media(max-width:700px)' not in compact:
              raise SystemExit('Authoritative mobile breakpoint missing from site-release.css.')
          if '.reveal,.reveal.visible{opacity:1!important;transform:none!important;transition:none!important' not in compact:
              raise SystemExit('Mobile content must never depend on scroll reveal visibility.')
          if '#services .service-grid' not in release:
              raise SystemExit('Services rail selector missing from authoritative release CSS.')
          if 'overflow-x:auto!important' not in compact or 'touch-action:auto!important' not in compact:
              raise SystemExit('Services rail must use native mobile scrolling.')
          for selector in ['.process-grid','.mail-in-grid','.why-grid','.faq-grid','.booking-shell']:
              if selector not in release:
                  raise SystemExit(f'Mobile width containment missing for {selector}')

          combined = (pages + supabase + app + analytics + release + guide + chat_css + pc_js + pc_css + store_hours_js).lower()
          if 'wearable' in combined:
              raise SystemExit('Public GotCracked site must not advertise wearable repair.')

          print('Public site integrity checks passed.')
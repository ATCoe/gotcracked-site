name: Public Site CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          for file in app.js learn.js analytics-loader.js customer-chat.js customer-account.js pc-build.js store-hours.js supabase.js; do
            [ -f "$file" ] && node --check "$file"
          done

      - name: Store hours and appointment windows
        run: node scripts/test-store-hours.mjs

      - name: Marlon browser audit safeguards
        run: node scripts/test-marlon-browser-audit.mjs

      - name: Truthful custom-PC request copy
        run: node scripts/test-pc-build-truthful-copy.mjs

      - name: Public site architecture
        shell: python
        run: |
          from pathlib import Path
          import re

          required_pages = ['index.html','request.html','appointment.html','pc-build.html','privacy.html','account.html','learn.html','credits.html']
          for name in required_pages:
              if not Path(name).exists():
                  raise SystemExit(f'Missing public page: {name}')

          html = Path('index.html').read_text(encoding='utf-8')
          request_html = Path('request.html').read_text(encoding='utf-8')
          appointment_html = Path('appointment.html').read_text(encoding='utf-8')
          pc_html = Path('pc-build.html').read_text(encoding='utf-8')
          privacy_html = Path('privacy.html').read_text(encoding='utf-8')
          account_html = Path('account.html').read_text(encoding='utf-8')
          learn_html = Path('learn.html').read_text(encoding='utf-8')
          credits_html = Path('credits.html').read_text(encoding='utf-8')
          pages = html + request_html + appointment_html + pc_html + privacy_html + account_html + learn_html + credits_html
          app = Path('app.js').read_text(encoding='utf-8')
          learn_js = Path('learn.js').read_text(encoding='utf-8')
          chat = Path('customer-chat.js').read_text(encoding='utf-8')
          chat_css = Path('customer-chat.css').read_text(encoding='utf-8')
          pc_js = Path('pc-build.js').read_text(encoding='utf-8')
          hours = Path('store-hours.js').read_text(encoding='utf-8')
          supabase = Path('supabase.js').read_text(encoding='utf-8')
          analytics = Path('analytics-loader.js').read_text(encoding='utf-8')
          release = Path('site-release.css').read_text(encoding='utf-8')
          headers = Path('_headers').read_text(encoding='utf-8')
          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')

          refs = re.findall(r'(?:src|href)=["\']([^"\']+)["\']', pages)
          missing = []
          for ref in refs:
              ref = ref.split('?',1)[0].split('#',1)[0]
              if not ref or ref.startswith(('http://','https://','mailto:','tel:','sms:','#')):
                  continue
              if ref.startswith('/'):
                  # canonical root-relative route: resolve to its page file
                  target = 'index.html' if ref == '/' else ref.lstrip('/') + '.html'
              else:
                  target = ref
              if not Path(target).exists(): missing.append(ref)
          if missing:
              raise SystemExit('Missing local references: ' + ', '.join(sorted(set(missing))))

          for css in Path('.').glob('*.css'):
              text = css.read_text(encoding='utf-8')
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'Unbalanced CSS braces: {css}')
          css_refs = re.findall(r'<link[^>]+rel=["\']stylesheet["\'][^>]+href=["\']([^"\']+)', html, re.I)
          css_files = [ref.split('?',1)[0] for ref in css_refs]
          for required in ['styles.css','hardening.css','repair-guide.css','customer-chat.css','site-release.css','asset-pass.css','device-photo-polish.css']:
              if required not in css_files: raise SystemExit(f'Missing first-paint stylesheet: {required}')
          if css_files[-2:] != ['asset-pass.css','device-photo-polish.css']: raise SystemExit('The asset and licensed device-photo polish styles must remain the final homepage stylesheets.')
          if 'visual-overhaul.css' in css_files: raise SystemExit('The visual overhaul must remain consolidated in the final asset-pass.css layer.')
          for asset in ['assets/photos/repair-bench-phone.jpg','assets/photos/repair-detail-phone.jpg','assets/photos/repair-laptop-workbench.jpg','assets/favicon-16.png','assets/favicon-32.png','assets/apple-touch-icon.png','assets/gotcracked-customer-app-icon-512.png','ASSET_PROVENANCE.md']:
              if not Path(asset).exists(): raise SystemExit(f'Missing release asset or provenance record: {asset}')
          for token in ['/credits#visual-assets','repair-bench-phone.jpg','repair-detail-phone.jpg','repair-laptop-workbench.jpg']:
              if token not in html: raise SystemExit(f'Authentic homepage visual missing: {token}')
          for token in ['Pexels License','Unsplash License','Illustrative Photography']:
              if token not in credits_html: raise SystemExit(f'Public image credit missing: {token}')

          if 'id="booking-form"' in html or 'href="#book"' in html: raise SystemExit('Repair intake must stay off the homepage.')
          if 'id="booking-form"' not in request_html: raise SystemExit('Repair request form missing.')
          if 'id="appointment-form"' not in appointment_html: raise SystemExit('Appointment form missing.')
          if 'Privacy Notice' not in request_html or 'Privacy Notice' not in appointment_html or 'Privacy Notice' not in pc_html: raise SystemExit('Customer forms must link the Privacy Notice.')
          stale_windows = re.compile(r'Morning \(9 AM[-–]12 PM\)|Afternoon \(12[-–]4 PM\)|Late afternoon \(4[-–]6 PM\)')
          if stale_windows.search(request_html) or stale_windows.search(appointment_html): raise SystemExit('Stale fixed appointment windows returned.')
          for form_html in [request_html, appointment_html]:
              if not re.search(r'<select name="time" required disabled>', form_html): raise SystemExit('Appointment time must wait for the settings-driven day selection.')
          if "dateInput.min = [localDateISO(new Date()), PLANNED_OPENING_DATE].sort().pop()" not in app: raise SystemExit('Appointment minimum-date guard missing.')
          for token in ["functions.invoke('public-media'", 'setCustomValidity', 'windowsFor', 'range.length!==2', 'DEFAULT_HOURS']:
              if token not in hours: raise SystemExit(f'Store-hours runtime guard missing: {token}')

          account_js = Path('customer-account.js').read_text(encoding='utf-8')
          if "customer-account" not in account_js or not any(token in account_js for token in ['supabase.co/functions/v1/', "'/api/customer-account'", '"/api/customer-account"']): raise SystemExit('Customer account is not wired to its server endpoint.')
          if 'SUPABASE_SERVICE_ROLE_KEY' in pages + app + chat + pc_js + account_js + supabase: raise SystemExit('Server-only credential marker found in public runtime.')

          if 'id="pc-build-form"' not in pc_html or 'pc-build.js' not in pc_html or 'pc-build.css' not in pc_html: raise SystemExit('Custom PC planner incomplete.')
          if "functions.invoke('custom-pc-build'" not in pc_js: raise SystemExit('Custom PC research endpoint missing.')
          if 'Newegg PC Builder' not in pc_html or 'Newegg PC Builder' not in pc_js: raise SystemExit('Custom PC compatibility disclosure missing.')
          if html.count('href="/pc-build"') < 2: raise SystemExit('Homepage custom-PC links missing.')
          sitemap_locs = re.findall(r'<loc>([^<]+)</loc>', sitemap)
          for required_loc in ['https://gotcracked.co/','https://gotcracked.co/request','https://gotcracked.co/appointment','https://gotcracked.co/pc-build','https://gotcracked.co/learn','https://gotcracked.co/privacy','https://gotcracked.co/credits']:
              if required_loc not in sitemap_locs: raise SystemExit(f'Canonical sitemap entry missing: {required_loc}')
          if any(loc.endswith('.html') for loc in sitemap_locs): raise SystemExit('Sitemap must use canonical extensionless URLs.')

          for asset in ['assets/social/youtube-official.png','assets/social/tiktok-official.png','assets/social/instagram-official.svg','assets/social/facebook-official.png']:
              if not Path(asset).exists(): raise SystemExit(f'Missing official social asset: {asset}')
          for token in ['youtube_channel_url','tiktok_profile_url','instagram_profile_url','facebook_profile_url']:
              if token not in app or token not in learn_js: raise SystemExit(f'Public social profile wiring missing: {token}')
          for token in ['id="learn-sponsor"','Advertising & affiliate disclosure','Advertise with GotCracked']:
              if token not in learn_html: raise SystemExit(f'Learn monetization guard missing: {token}')
          if 'site_sponsor_active' not in learn_js or 'rel="sponsored noopener noreferrer"' not in learn_js: raise SystemExit('Learn sponsor runtime guard missing.')

          for token in ['body .container.process-grid','body .container.mail-in-grid','body .container.faq-grid','body .issue-card>.console-platforms','body .gc-chat-launcher']:
              if token not in chat_css: raise SystemExit(f'Mobile layout guard missing: {token}')

          for token in ['gc-chat-contact', "action:'handoff'", 'preferredContact', 'requestHuman:handoffPending', 'requiresContact', 'handoffReady']:
              if token not in chat and token not in chat_css: raise SystemExit(f'Customer human-handoff guard missing: {token}')
          if 'TWILIO_AUTH_TOKEN' in chat or 'GOOGLE_CHAT_SERVICE_ACCOUNT_JSON' in chat:
              raise SystemExit('Server-side communication credentials must never be exposed on the public site.')
          compact = re.sub(r'\s+', '', release)
          if '@media(max-width:700px)' not in compact: raise SystemExit('Authoritative mobile breakpoint missing.')
          if 'overflow-x:auto!important' not in compact or 'touch-action:auto!important' not in compact: raise SystemExit('Native mobile service scrolling guard missing.')
          if "createElement('link')" in app or 'createElement("link")' in app: raise SystemExit('Public app must not inject first-paint styles.')

          if "import('./analytics-loader.js" not in supabase: raise SystemExit('Analytics loader bootstrap missing.')
          for token in ['google_analytics_measurement_id','doNotTrack','allow_google_signals: false','allow_ad_personalization_signals: false']:
              if token not in analytics: raise SystemExit(f'Analytics privacy guard missing: {token}')
          for endpoint in ['https://www.googletagmanager.com','https://www.google-analytics.com','https://region1.google-analytics.com']:
              if endpoint not in headers: raise SystemExit(f'Analytics CSP endpoint missing: {endpoint}')

          combined = (pages + app + chat + pc_js + account_js + release).lower()
          if 'wearable' in combined: raise SystemExit('Unsupported wearable repair returned to public copy.')

          print('Public site integrity checks passed.')


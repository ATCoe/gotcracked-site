name: Public Site CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          for file in app.js analytics-loader.js customer-chat.js customer-account.js pc-build.js store-hours.js supabase.js; do
            [ -f "$file" ] && node --check "$file"
          done

      - name: Public site architecture
        shell: python
        run: |
          from pathlib import Path
          import re

          required_pages = ['index.html','request.html','appointment.html','pc-build.html','privacy.html','customer-account.html']
          for name in required_pages:
              if not Path(name).exists():
                  raise SystemExit(f'Missing public page: {name}')

          html = Path('index.html').read_text(encoding='utf-8')
          request_html = Path('request.html').read_text(encoding='utf-8')
          appointment_html = Path('appointment.html').read_text(encoding='utf-8')
          pc_html = Path('pc-build.html').read_text(encoding='utf-8')
          privacy_html = Path('privacy.html').read_text(encoding='utf-8')
          account_html = Path('customer-account.html').read_text(encoding='utf-8')
          pages = html + request_html + appointment_html + pc_html + privacy_html + account_html
          app = Path('app.js').read_text(encoding='utf-8')
          chat = Path('customer-chat.js').read_text(encoding='utf-8')
          chat_css = Path('customer-chat.css').read_text(encoding='utf-8')
          pc_js = Path('pc-build.js').read_text(encoding='utf-8')
          hours = Path('store-hours.js').read_text(encoding='utf-8')
          supabase = Path('supabase.js').read_text(encoding='utf-8')
          analytics = Path('analytics-loader.js').read_text(encoding='utf-8')
          release = Path('site-release.css').read_text(encoding='utf-8')
          headers = Path('_headers').read_text(encoding='utf-8')
          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')

          # All local static references used by customer pages must exist.
          refs = re.findall(r'(?:src|href)=["\']([^"\']+)["\']', pages)
          missing = []
          for ref in refs:
              ref = ref.split('?',1)[0].split('#',1)[0]
              if not ref or ref.startswith(('http://','https://','mailto:','tel:','#')):
                  continue
              if not Path(ref).exists(): missing.append(ref)
          if missing:
              raise SystemExit('Missing local references: ' + ', '.join(sorted(set(missing))))

          # CSS must parse structurally and the authoritative release sheet remains last on the homepage.
          for css in Path('.').glob('*.css'):
              text = css.read_text(encoding='utf-8')
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'Unbalanced CSS braces: {css}')
          css_refs = re.findall(r'<link[^>]+rel=["\']stylesheet["\'][^>]+href=["\']([^"\']+)', html, re.I)
          css_files = [ref.split('?',1)[0] for ref in css_refs]
          for required in ['styles.css','hardening.css','repair-guide.css','site-release.css']:
              if required not in css_files: raise SystemExit(f'Missing first-paint stylesheet: {required}')
          if css_files[-1] != 'site-release.css': raise SystemExit('site-release.css must remain the final homepage stylesheet.')

          # Customer repair flows stay dedicated, privacy-linked, and within store hours.
          if 'id="booking-form"' in html or 'href="#book"' in html: raise SystemExit('Repair intake must stay off the homepage.')
          if 'id="booking-form"' not in request_html: raise SystemExit('Repair request form missing.')
          if 'id="appointment-form"' not in appointment_html: raise SystemExit('Appointment form missing.')
          if 'Privacy Notice' not in request_html or 'Privacy Notice' not in appointment_html or 'Privacy Notice' not in pc_html: raise SystemExit('Customer forms must link the Privacy Notice.')
          if 'Late afternoon (4-6 PM)' not in request_html or 'Late afternoon (4-6 PM)' not in appointment_html: raise SystemExit('Late-afternoon appointment window missing.')
          if "dateInput.min = [localDateISO(new Date()), PLANNED_OPENING_DATE].sort().pop()" not in app: raise SystemExit('Appointment minimum-date guard missing.')
          for token in ["functions.invoke('public-media'", 'setCustomValidity', 'WINDOWS', 'DEFAULT_HOURS']:
              if token not in hours: raise SystemExit(f'Store-hours runtime guard missing: {token}')

          # Customer account/payment entry stays server mediated; the public site never owns a service credential.
          account_js = Path('customer-account.js').read_text(encoding='utf-8')
          if "functions.invoke('customer-account'" not in account_js: raise SystemExit('Customer account is not wired to its server endpoint.')
          if 'SUPABASE_SERVICE_ROLE_KEY' in pages + app + chat + pc_js + account_js + supabase: raise SystemExit('Server-only credential marker found in public runtime.')

          # Custom PC planner stays separate from repair intake and keeps compatibility disclosure.
          if 'id="pc-build-form"' not in pc_html or 'pc-build.js' not in pc_html or 'pc-build.css' not in pc_html: raise SystemExit('Custom PC planner incomplete.')
          if "functions.invoke('custom-pc-build'" not in pc_js: raise SystemExit('Custom PC research endpoint missing.')
          if 'Newegg PC Builder' not in pc_html or 'Newegg PC Builder' not in pc_js: raise SystemExit('Custom PC compatibility disclosure missing.')
          if html.count('href="pc-build.html"') < 2: raise SystemExit('Homepage custom-PC links missing.')
          if 'https://gotcracked.co/pc-build.html' not in sitemap: raise SystemExit('Custom PC sitemap entry missing.')

          # Mobile layout fixes stay in first-paint CSS rather than runtime injection.
          for token in ['body .container.process-grid','body .container.mail-in-grid','body .container.faq-grid','body .issue-card>.console-platforms','body .gc-chat-launcher']:
              if token not in chat_css: raise SystemExit(f'Mobile layout guard missing: {token}')
          compact = re.sub(r'\s+', '', release)
          if '@media(max-width:700px)' not in compact: raise SystemExit('Authoritative mobile breakpoint missing.')
          if 'overflow-x:auto!important' not in compact or 'touch-action:auto!important' not in compact: raise SystemExit('Native mobile service scrolling guard missing.')
          if "createElement('link')" in app or 'createElement("link")' in app: raise SystemExit('Public app must not inject first-paint styles.')

          # Analytics stays configuration-driven, DNT-aware, and non-ad-personalized.
          if "import('./analytics-loader.js" not in supabase: raise SystemExit('Analytics loader bootstrap missing.')
          for token in ['google_analytics_measurement_id','doNotTrack','allow_google_signals: false','allow_ad_personalization_signals: false']:
              if token not in analytics: raise SystemExit(f'Analytics privacy guard missing: {token}')
          for endpoint in ['https://www.googletagmanager.com','https://www.google-analytics.com','https://region1.google-analytics.com']:
              if endpoint not in headers: raise SystemExit(f'Analytics CSP endpoint missing: {endpoint}')

          combined = (pages + app + chat + pc_js + account_js + release).lower()
          if 'wearable' in combined: raise SystemExit('Unsupported wearable repair returned to public copy.')

          print('Public site integrity checks passed.')
